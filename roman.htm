<script language="javascript">
function Changer(){
if(document.myform.tupac[0].checked) {
var num = parseInt(document.myform.numin.value)
var ans = "";
var m = Math.floor(num/1000);
num = num - (m*1000);
var d = Math.floor(num/500);
num = num - (d*500);
var c = Math.floor(num/100);
num = num - (c*100);
var L = Math.floor(num/50);
num = num - (L*50);
var x = Math.floor(num/10);
num = num - (x*10);
var v = Math.floor(num/5);
num = num - (v*5);
var i = Math.floor(num/1);
for(j=1;j<=m;j++) {ans += "M";}

if(d == 1 && c == 4) {ans +="CM"; c = 0;}
else if(d==1)  {ans += "D";}
if(c==4) {ans+="CD"}
for(j=1;j<=c;j++) {ans +="C"}

if(L == 1 && x == 4) {ans +="XC"; x = 0;}
else if(L==1)  {ans += "L";}
if(x==4) {ans+="XL"}
for(j=1;j<=x;j++) {ans +="X"}

if(v == 1 && i == 4) {ans +="IX"; c = 0;}
else if(v==1)  {ans += "V";}
if(c==4) {ans+="IV"}
for(j=1;j<=i;j++) {ans +="I"}

document.myform.numout.value = ans
	}
else { 
var romnum = document.myform.numin.value;
var len = romnum.length;
var total = 0;
var now = ""; 
var next = "";
for(i=0;i<len;i++) { 
	now = romnum.charAt(i).toUpperCase();
	next = romnum.charAt(i+1).toUpperCase();
switch(now) {
case "M": total+=1000; break; 
case "D": total+=500; break;
case "L": total+= 50; break;
case "V": total+=5; break;
case "C": if(next=="M") {total+=900; i++;} 
		else if(next=="D") {total+=400; i++;}
		else total +=100; break;
case "X": total+=10; break;
		if(next=="C") {total+=900; i++;} 
		else if(next=="L") {total+=400; i++;}
		else total +=100; break;
case "I": total+=1; break;
		if(next=="X") {total+=900; i++;} 
		else if(next=="V") {total+=400; i++;}
		else total +=100; break;
	}
	}
document.myform.numout.value = total;
}
}

</script>
