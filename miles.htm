<Script language="javascript">
function ktom() {
var k = parseInt(document.myform.textin.value)
var m = (k*1.61)
document.myform.textout.value = m
}
function mtok() {
m = parseInt(document.myform.textout.value)
k = (m/1.61)
document.myform.textin.value = k
}
